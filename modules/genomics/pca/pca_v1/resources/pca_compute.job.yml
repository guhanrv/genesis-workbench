resources:
  jobs:
    pca_compute:
      name: pca_glow_compute

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        # Step 1 — the ONLY Glow/classic-cluster task: VCF -> dosage Delta.
        - task_key: ingest_vcf
          max_retries: 0
          job_cluster_key: pca_ingest_cluster
          libraries:
            - jar: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/libraries/glow-spark3-assembly-2.0.4-SNAPSHOT.jar
          notebook_task:
            notebook_path: ../notebooks/00_ingest_vcf.py
            source: WORKSPACE

        # Step 2 — QC + shared FRAPOSA fit (lib/pca_fit) on the dosage Delta. Classic single-node: the
        # fit collects the pruned matrix to the driver for the eigh (needs a real driver, not serverless's
        # fixed one), and backend=distributed uses the RDD/MLlib API which serverless doesn't expose — so
        # this task must be classic for BOTH backends to run. Save/mark tasks stay serverless (light).
        - task_key: compute_pca
          max_retries: 0
          timeout_seconds: 21600
          depends_on:
            - task_key: ingest_vcf
          job_cluster_key: pca_compute_cluster
          notebook_task:
            notebook_path: ../notebooks/01_compute_pca.py
            source: WORKSPACE

        - task_key: save_results
          max_retries: 0
          depends_on:
            - task_key: compute_pca
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/02_save_results.py
            source: WORKSPACE

        - task_key: mark_success
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: save_results
          run_if: ALL_SUCCESS
          notebook_task:
            notebook_path: ../notebooks/update_mlflow_status.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.mlflow_run_id}}"
              job_status: "pca_complete"
          environment_key: default

        - task_key: mark_failure
          max_retries: 0
          disable_auto_optimization: true
          depends_on:
            - task_key: save_results
          run_if: AT_LEAST_ONE_FAILED
          notebook_task:
            notebook_path: ../notebooks/update_mlflow_status.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.mlflow_run_id}}"
              job_status: "failed"
          environment_key: default

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: vcf_path
          default: ""
        - name: dosage_field
          default: "auto"
        - name: n_components
          default: "10"
        - name: maf_cutoff
          default: "0.05"
        - name: max_variants
          default: "0"
        - name: r2
          default: "0.05"
        - name: window_bp
          default: "1000000"
        - name: model_dir            # where 01_compute_pca writes the projectable model npz
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/pca_results
        - name: backend              # driver (default) | distributed (large cohorts; classic cluster)
          default: driver
        - name: mlflow_run_id
          default: ""
        - name: user_email
          default: ${var.current_user}

      # Classic clusters: ingest (Glow) + compute_pca (driver-collect eigh / RDD distributed backend).
      # save_results + mark_* stay serverless (environment_key: default) — they only read a table / log MLflow.
      job_clusters:
        - job_cluster_key: pca_ingest_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            driver_node_type_id: ${var.cpu_node_type}
            custom_tags:
              work_type: pca_ingest
            enable_elastic_disk: true
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 2

        - job_cluster_key: pca_compute_cluster      # single-node fit: driver-collect eigh + RDD/MLlib distributed backend
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            data_security_mode: SINGLE_USER          # SINGLE_USER (not shared) → RDD/MLlib available for backend=distributed
            runtime_engine: STANDARD
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*, 2]"
              spark.driver.memory: "16g"             # room for the driver-collect eigh
              spark.driver.maxResultSize: "8g"
            custom_tags:
              ResourceClass: SingleNode
              work_type: pca_compute
            enable_elastic_disk: true

      environments:
        - environment_key: default
          spec:
            client: '4'

      tags: ${var.common_resource_tags}

      queue:
        enabled: true
