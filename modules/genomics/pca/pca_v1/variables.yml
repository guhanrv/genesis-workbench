variables:
  current_user:
    description: User deploying the bundle. Can apply to service principals as well.
    default: ${workspace.current_user.userName}

  current_working_directory:
    description: Working directory or bundle root.
    default: /Users/${var.current_user}/.bundle/${bundle.name}/${bundle.target}

  workspace_url:
    description: Workspace url for deployment

  common_resource_tags:
    description: Resource tags
    default:
      application: genesis_workbench
      module: genomics
      created_by: ${workspace.current_user.short_name}

  cpu_node_type:
    description: Node type for CPU vms

  t4_node_type:
    description: Node type for T4 GPUs

  a10_node_type:
    description: Node type for A10 GPUs

  gpu_small_setting:
    description: The config setting for small gpu

  gpu_medium_setting:
    description: The config setting for medium gpu

  gpu_large_setting:
    description: The config setting for large gpu

  core_catalog_name:
    description: Primary catalog where data, models, and files are stored for this project.

  core_schema_name:
    description: The schema where core components will be installed.

  sql_warehouse_id:
    description: Id of the SQL Warehouse that will be used by the app

  pca_reference_dir:
    description: >-
      Volume dir where the HGDP+1kGP reference panel is staged (ref_00_download_panel) and the frozen
      basis is built. pca_v1 owns this ancestry-reference; prs reads the panel + basis from here.
    default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/pca_reference/panel

  pca_basis:
    description: >-
      Volume path to the frozen FRAPOSA PCA basis (pca_basis.npz) produced by
      ref_01_build_basis. The one projectable model prs projects members onto for ancestry
      classification (and the reference PCs for the RF). Ancestry analogue of a saved ML model.
    default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/pca_reference/pca_basis.npz

  ancestry_pca_model_name:
    description: >-
      UC model name (within core_catalog.core_schema) of the ancestry_pca pyfunc. Built by
      ref_01_build_basis alongside pca_basis.npz. PRS loads @champion when present.
    default: ancestry_pca

  ancestry_classifier_model_name:
    description: >-
      UC model name of the ancestry_classifier pyfunc (PCs → MSP / rf_probs / is_outlier).
    default: ancestry_classifier

  module_registration_experiment_name:
    description: MLflow experiment tag the module logs the registered models under.
    default: dbx_genesis_workbench_modules

  databricks_app_names:
    description: >-
      Colon-separated app names whose service principals get run-permission grants on this
      module's jobs. Override in module.env when core used a non-default app_name.
    default: genesis-workbench:mcp-genesis-workbench

  app_sp_client_id:
    description: >-
      UI app service-principal client id, granted CAN_MANAGE_RUN on pca_reference_setup.
      Resolved by modules/genomics/deploy.sh. Empty = no SP grant (first install, no app yet).
    default: ""
