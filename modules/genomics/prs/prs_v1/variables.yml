variables:
  current_user:
    description: User deploying the bundle. Can apply to service principals as well.
    default: ${workspace.current_user.userName}

  current_working_directory:
    description: Working directory or bundle root.
    default: /Users/${var.current_user}/.bundle/${bundle.name}/${bundle.target}

  workspace_url:
    description: Workspace url for deployment

  common_resource_tags:
    description: Resource tags
    default:
      application: genesis_workbench
      module: genomics
      created_by: ${workspace.current_user.short_name}

  cpu_node_type:
    description: Node type for CPU vms

  t4_node_type:
    description: Node type for T4 GPUs

  a10_node_type:
    description: Node type for A10 GPUs

  gpu_small_setting:
    description: The config setting for small gpu

  gpu_medium_setting:
    description: The config setting for medium gpu

  gpu_large_setting:
    description: The config setting for large gpu

  core_catalog_name:
    description: Primary catalog where data, models, and files are stored for this project.

  core_schema_name:
    description: The schema where core components will be installed.

  sql_warehouse_id:
    description: Id of the SQL Warehouse that will be used by the app

  pca_reference_setup_job_id:
    description: >-
      Job id of pca_v1's `pca_reference_setup` (a DIFFERENT bundle), used by the top-level
      `genomics_prs_pipeline` orchestrator to build the ancestry basis before scoring. Cross-bundle
      job refs can't resolve via ${resources.*}, so it's passed in (set at deploy: `--var
      pca_reference_setup_job_id=<id>`, or resolved by name from `databricks jobs list`). 0 = the
      orchestrator's pca step will fail fast with "job 0 not found" until it's set.
    default: "0"

  prs_fasta_ref_cache:
    description: >-
      Volume dir caching the content-addressed FASTA-ref array (keyed by registered-PGS set + FASTA),
      so repeat/incremental extractions skip the ~30s rebuild (Stage-0 profile: 21% of the pipeline).
    default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_reference/fasta_ref_cache

  prs_landing_zone:
    description: >-
      Volume dir where incoming gVCFs land. The prs_scoring job's file-arrival trigger monitors it
      and BATCHES arrivals (one run drains all pending gVCFs — ~45x cheaper/member than per-member
      runs, per Stage-0). Also the default vcf_dir for extraction.
    default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_data/incoming

  pca_reference_dir:
    description: >-
      Volume dir where the pca module stages the HGDP+1kGP panel (pca owns the ancestry reference).
      prs reads the panel pgen/pvar from here (build_panel_stats) as a read-only artifact. Same
      core catalog+schema as pca_v1, so the path resolves cross-module. Run pca_reference_setup first.
    default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/pca_reference/panel

  prs_pca_basis:
    description: >-
      Volume path to the frozen FRAPOSA PCA basis (pca_basis.npz) that 04_build_sample_ancestry
      projects members onto for MSP. BUILT BY THE PCA MODULE (pca_v1/ref_01_build_basis);
      prs consumes it as a read-only artifact. Ancestry analogue of a saved model.
    default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/pca_reference/pca_basis.npz
