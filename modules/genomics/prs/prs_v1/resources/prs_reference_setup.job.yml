resources:
  jobs:
    prs_reference_setup:
      name: prs_reference_setup
      timeout_seconds: 28800            # 8h backstop for the one-time genome-wide panel scan

      # ONE-TIME scoring-reference builder (run on demand, not per scoring run), Spark-native — NO plink2
      # (pgenlib reads the panel pgen). A SINGLE panel scan at the registered PGS-union loci produces BOTH:
      #   - pgs_panel_afreq  (per-variant panel effect-AF, for missing→2·AF mean-impute) — a byproduct of
      #   - pgs_panel_ref    (per-PGS × superpop {mean,sd,quantiles}: COMPUTE the reference distribution by
      #     scoring the panel per PGS, so z_msp/z_admixed need no offline plink2 curation and scale to
      #     100+ PGS). Leave prs.yaml reference_distribution EMPTY to use this computed path; populate it
      #     only to OVERRIDE with externally-frozen stats (register writes those). panel_version MUST
      #     match the curation version the scorer normalizes against.
      #
      # The ANCESTRY reference (HGDP+1kGP panel staging + the frozen PCA basis) is owned by the pca
      # module now — see pca_v1/resources/pca_reference_setup.job.yml. This task READS that panel as a
      # read-only Volume artifact (${var.pca_reference_dir}); run pca_reference_setup first.
      #
      # NOTE: reads the registered `pgs_weights` — run 01_register_catalog (via the prs_scoring job) at
      #       least once before this. The panel scoring is worker-scalable (panel × union is large) —
      #       TITRATE prs_ref_cluster.num_workers up for a faster one-time genome-wide build. The
      #       union↔pgen match is driver-bounded per chromosome, so a genome-wide union won't OOM.

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: build_panel_stats              # ONE scan → pgs_panel_afreq + pgs_panel_ref (+quantiles)
          max_retries: 0
          timeout_seconds: 28800
          job_cluster_key: prs_ref_cluster
          notebook_task:
            notebook_path: ../notebooks/ref_00_build_panel_stats.py
            source: WORKSPACE

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        # panel pgen/pvar/psam/king — read from the pca module's ancestry-reference volume (pca owns it)
        - name: panel_pgen
          default: ${var.pca_reference_dir}/GRCh38_HGDP+1kGP_ALL.pgen
        - name: panel_pvar_parquet
          default: ${var.pca_reference_dir}/GRCh38_HGDP+1kGP_ALL.pvar.parquet
        - name: panel_psam
          default: ${var.pca_reference_dir}/GRCh38_HGDP+1kGP_ALL.psam
        - name: king_cutoff                        # empty = use all panel samples (matches function_prs reference)
          default: ""
        - name: panel_version                      # MUST match the curation version the scorer normalizes against
          default: ""
        - name: pgs_ids
          default: ""

      job_clusters:
        - job_cluster_key: prs_ref_cluster       # pgenlib/Spark panel-afreq build (no plink2)
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*, 2]"
              spark.driver.memory: "16g"
              spark.driver.maxResultSize: "8g"
            custom_tags:
              ResourceClass: SingleNode
              work_type: prs_reference_setup
            enable_elastic_disk: true

      tags: ${var.common_resource_tags}
