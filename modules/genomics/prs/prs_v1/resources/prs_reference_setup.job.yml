resources:
  jobs:
    prs_reference_setup:
      name: prs_reference_setup

      # ONE-TIME reference-artifact builders (run on demand, not per scoring run). Stages the pgsc
      # HGDP+1kGP panel to the prs_reference volume, then builds the frozen ancestry PCA basis and the
      # panel allele-frequency table on top of it. All classic single-node (Glow-free but plink2/pgenlib);
      # ephemeral (auto-terminate). These outputs (panel pgen, pca_basis.npz, pgs_panel_afreq) are the
      # fixed references the scoring job consumes — build once, reuse across all scoring runs.
      #
      # NOTE: build_panel_afreq reads the registered `pgs_weights` (to know which variants to price), so
      #       run 00_register_catalog (via the prs_scoring job) at least once before it. build_pca_basis
      #       needs the plink2 binary on the runner (plink2_path); if unavailable, build pca_basis.npz
      #       locally and stage it to out_path instead — the artifact is identical (shared numpy fit).

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        # 1 — download + stage the pgsc panel (pgen/pvar.zst/psam/king.cutoff) + derive pvar.parquet.
        - task_key: download_panel
          max_retries: 0
          job_cluster_key: prs_ref_cluster
          notebook_task:
            notebook_path: ../notebooks/00_download_panel.py
            source: WORKSPACE

        # 2 — QC + LD-prune the panel (plink2) → FRAPOSA fit → pca_basis.npz (the ancestry basis).
        - task_key: build_pca_basis
          max_retries: 0
          depends_on:
            - task_key: download_panel
          job_cluster_key: prs_ref_cluster
          notebook_task:
            notebook_path: ../notebooks/00_build_pca_basis.py
            source: WORKSPACE

        # 3 — panel allele frequencies for the registered PGS union → pgs_panel_afreq (for mean_impute).
        #     Requires a prior 00_register_catalog run (reads pgs_weights).
        - task_key: build_panel_afreq
          max_retries: 0
          depends_on:
            - task_key: download_panel
          job_cluster_key: prs_ref_cluster
          notebook_task:
            notebook_path: ../notebooks/04_build_panel_afreq.py
            source: WORKSPACE

      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        # panel staging (00_download_panel) + where the builders read it from
        - name: dest_volume_dir
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_reference/panel
        - name: panel_dir
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_reference/panel
        # PCA basis (00_build_pca_basis)
        - name: out_path
          default: ${var.prs_pca_basis}
        - name: high_ld_path        # stage the pgsc_calc high-LD-regions-hg38 file here
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_reference/high-LD-regions-hg38-GRCh38.txt
        - name: plink2_path
          default: plink2
        - name: dim_ref
          default: "10"
        - name: panel_version
          default: pgsc_HGDP+1kGP_v1
        # panel afreq (04_build_panel_afreq)
        - name: panel_pgen
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_reference/panel/GRCh38_HGDP+1kGP_ALL.pgen
        - name: panel_pvar_parquet
          default: /Volumes/${var.core_catalog_name}/${var.core_schema_name}/prs_reference/panel/GRCh38_HGDP+1kGP_ALL.pvar.parquet
        - name: pgs_ids
          default: ""

      job_clusters:
        - job_cluster_key: prs_ref_cluster       # panel download + plink2/pgenlib reference builds
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*, 4]"
            custom_tags:
              ResourceClass: SingleNode
              work_type: prs_reference_setup
            enable_elastic_disk: true

      tags: ${var.common_resource_tags}
