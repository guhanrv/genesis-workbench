resources:
  jobs:
    prs_scoring:
      name: prs_scoring

      # Distributed, incremental, multi-PGS / multi-sample PRS.
      #   setup_stores -> register -> extract_dosage -> ancestry -> optional synthetic fan-out
      #                -> reconcile -> score_prs
      # ALL tasks run on CLASSIC job clusters with a fixed, explicit num_workers, started
      # MINIMAL (single-node) and titrated up per job from benchmark numbers. NOTHING runs
      # on serverless (its unbounded autoscale is the #1 bill-blowup risk). Job clusters are
      # ephemeral (auto-terminate at job end).
      #
      # COST IDIOT-PROOFING: reconcile defaults to apply=false (DRY-RUN). A default run
      # computes the plan, prints the cell count + estimated cost, writes an EMPTY runnable
      # plan, and the scorer no-ops. To actually score you must set apply=true; a plan larger
      # than max_cells additionally requires confirm_large=true. A stray run can never fire
      # the full grid.

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        # 1 — idempotent DDL for the five persistent stores.
        - task_key: setup_stores
          max_retries: 0
          job_cluster_key: prs_light_cluster
          notebook_task:
            notebook_path: ../notebooks/00_setup_stores.py
            source: WORKSPACE

        # 2 — curation (prs.yaml + scorefiles) -> pgs_registry / pgs_weights / pgs_panel_ref.
        - task_key: register
          max_retries: 0
          depends_on:
            - task_key: setup_stores
          job_cluster_key: prs_light_cluster
          notebook_task:
            notebook_path: ../notebooks/01_register_catalog.py
            source: WORKSPACE

        # 3 — per-sample gVCF -> dosage (pysam kernel; one Spark task per sample). Titrate
        #     prs_extract_cluster.num_workers up for large cohorts (this is the real cost).
        - task_key: extract_dosage
          max_retries: 1                 # MERGE writes are idempotent → retry-safe on transient node loss
          timeout_seconds: 14400         # 4h backstop: a wedged pysam/FUSE read can't bill unbounded
          depends_on:
            - task_key: register
          job_cluster_key: prs_extract_cluster
          notebook_task:
            notebook_path: ../notebooks/02_extract_dosage.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: pysam==0.22.1

        # 4 — the incremental brain + cost kill-switch: emit ONLY missing/stale cells.
        - task_key: reconcile
          max_retries: 0
          depends_on:
            - task_key: materialize_scale_manifest
            - task_key: build_sample_ancestry
          run_if: NONE_FAILED
          job_cluster_key: prs_light_cluster
          notebook_task:
            notebook_path: ../notebooks/03_reconcile.py
            source: WORKSPACE

        # 4b — per-sample ancestry: OADP-project members onto the frozen PCA basis → RF MSP →
        #      sample_ancestry. Extraction (basis loci) is distributed like extract_dosage; reuses
        #      the (warm) extract cluster right after it — so ancestry runs in PARALLEL with reconcile
        #      (light cluster), both finishing before score_prs. Incremental (skips classified members).
        - task_key: build_sample_ancestry
          max_retries: 1                 # MERGE writes are idempotent → retry-safe
          timeout_seconds: 14400
          depends_on:
            - task_key: extract_dosage
          job_cluster_key: prs_extract_cluster
          notebook_task:
            notebook_path: ../notebooks/04_build_sample_ancestry.py
            source: WORKSPACE
          libraries:
            - pypi:
                package: pysam==0.22.1
            - pypi:
                package: scikit-learn==1.3.0
            - pypi:
                package: scipy==1.11.1
            - pypi:
                package: mlflow==2.22.0

        # 4c — condition task prevents the 5-node fan-out cluster from starting in production.
        - task_key: fanout_enabled
          depends_on:
            - task_key: extract_dosage
            - task_key: build_sample_ancestry
          condition_task:
            op: NOT_EQUAL
            left: "{{job.parameters.sample_manifest_path}}"
            right: ""

        # SYNTHETIC scale testing only. Copies canonical dosage/ancestry rows to logical IDs
        # using a bounded, distributed Delta fan-out. It never reparses one gVCF N times.
        - task_key: materialize_scale_manifest
          max_retries: 1
          timeout_seconds: 14400
          depends_on:
            - task_key: fanout_enabled
              outcome: "true"
          job_cluster_key: prs_fanout_cluster
          notebook_task:
            notebook_path: ../notebooks/materialize_scale_manifest.py
            source: WORKSPACE

        # 5 — SQL join-aggregate over the plan + panel-ref normalization + MERGE prs_scores.
        - task_key: score_prs
          max_retries: 1                 # MERGE writes are idempotent → retry-safe
          timeout_seconds: 14400
          depends_on:
            - task_key: reconcile
            - task_key: build_sample_ancestry
          job_cluster_key: prs_score_cluster
          notebook_task:
            notebook_path: ../notebooks/05_score_prs.py
            source: WORKSPACE

        # 6 — publish results + log cohort summary metrics to MLflow (mirrors pca/gwas save_results).
        - task_key: save_results
          max_retries: 0
          depends_on:
            - task_key: score_prs
          job_cluster_key: prs_light_cluster
          notebook_task:
            notebook_path: ../notebooks/06_save_results.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.mlflow_run_id}}"

        # 7 — MLflow run status (framework convention; matches pca/gwas). No-ops when
        #     mlflow_run_id is empty (a manual run not launched via batch-model invocation).
        - task_key: mark_success
          max_retries: 0
          depends_on:
            - task_key: save_results
          run_if: ALL_SUCCESS
          job_cluster_key: prs_light_cluster
          notebook_task:
            notebook_path: ../notebooks/update_mlflow_status.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.mlflow_run_id}}"
              job_status: "prs_complete"

        - task_key: mark_failure
          max_retries: 0
          depends_on:
            - task_key: save_results
          run_if: AT_LEAST_ONE_FAILED
          job_cluster_key: prs_light_cluster
          notebook_task:
            notebook_path: ../notebooks/update_mlflow_status.py
            source: WORKSPACE
            base_parameters:
              mlflow_run_id: "{{job.parameters.mlflow_run_id}}"
              job_status: "failed"

      # Job-level parameters propagate to every task's matching notebook widget.
      parameters:
        - name: catalog
          default: ${var.core_catalog_name}
        - name: schema
          default: ${var.core_schema_name}
        - name: mlflow_run_id           # set by framework batch-model invocation; empty ⇒ status tasks no-op
          default: ""
        # entry_mode is an OPERATOR-INTENT hint for logging (full | add_pgs | add_sample |
        # restate_pgs). Incrementality is AUTOMATIC — reconcile's anti-join and extract's
        # sample-skip decide the real work regardless of this value.
        - name: entry_mode
          default: full
        # register
        - name: catalog_config_path      # prs.yaml (curation source of truth)
          default: ""
        - name: scorefile_dir            # dir of harmonized <scoring_file>s
          default: ""
        # extract — defaults to the batched landing zone (a triggered run drains ALL pending gVCFs
        # in one pass; extract's sample-level anti-join skips ones already in dosage).
        - name: vcf_dir
          default: ${var.prs_landing_zone}
        - name: vcf_paths
          default: ""
        - name: fasta_path
          default: ""
        - name: fasta_ref_cache_dir     # cache the FASTA-ref array → repeat extractions skip the ~30s rebuild
          default: ${var.prs_fasta_ref_cache}
        - name: reextract                # true to re-extract existing samples (after add-PGS)
          default: "false"
        # synthetic scale manifest — empty in every production run
        - name: sample_manifest_path
          default: ""
        - name: confirm_synthetic_fanout
          default: "false"
        - name: fanout_batch_size
          default: "25"
        - name: max_fanout_rows
          default: "1000000000"
        - name: target_rows_per_file
          default: "2000000"
        - name: fanout_staging_root
          default: ""
        # ancestry (build_sample_ancestry) — the frozen PCA basis it projects members onto
        - name: basis_path
          default: ${var.prs_pca_basis}
        - name: pca_model_name
          default: ancestry_pca
        - name: classifier_model_name
          default: ancestry_classifier
        - name: model_alias
          default: champion
        # scope (register + extract + reconcile all honor pgs_ids)
        - name: pgs_ids
          default: ""
        - name: samples                  # reconcile: limit to these sample_ids (empty = all)
          default: ""
        - name: panel_version
          default: ""
        # reconcile guardrails — DRY-RUN by default (scores nothing)
        - name: apply
          default: "false"
        - name: max_cells
          default: "100000"
        - name: confirm_large
          default: "false"
        - name: dbu_per_cell             # set from Stage-0 benchmark to get a cost estimate
          default: "0.0"
        # score_prs — PGS-axis chunking (bounds mean_impute densify / shuffle)
        - name: pgs_chunk_size           # >0 = fixed # PGS per chunk; 0 = use weight budget
          default: "0"
        - name: max_weight_rows_per_chunk  # when pgs_chunk_size=0; 0 = no PGS chunking
          default: "0"
        - name: sample_chunk_size          # max samples per densify join; 0 = all-at-once
          default: "10"
        - name: missing_mode
          default: "mean_impute"

      # Classic job clusters. START MINIMAL (single-node); titrate num_workers per job from
      # benchmark evidence. SINGLE_USER is required for Unity Catalog access. cpu_node_type
      # only (never GPU). No autotermination_minutes needed — job clusters die at job end.
      job_clusters:
        - job_cluster_key: prs_light_cluster      # setup / register / reconcile (light SQL + parse)
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
              work_type: prs_light
            enable_elastic_disk: true

        - job_cluster_key: prs_extract_cluster    # per-sample gVCF extraction (CPU-bound)
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: 0                          # TITRATE UP for many samples (1 task/sample)
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*]"
            custom_tags:
              ResourceClass: SingleNode
              work_type: prs_extract
            enable_elastic_disk: true

        - job_cluster_key: prs_score_cluster       # join-aggregate + MERGE (shuffle-bound)
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.cpu_node_type}
            driver_node_type_id: ${var.cpu_node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            # n=10 W4: 7× wall vs 1 node. n=100 sample_chunk=10: 64 min, 0 spill on 4 workers.
            num_workers: ${var.prs_score_num_workers}
            custom_tags:
              ResourceClass: MultiNode
              work_type: prs_score
            enable_elastic_disk: true

        # Synthetic sample-axis fan-out only: fixed worker count makes benchmark runtime/cost
        # reproducible. This is a streaming Spark join/write, not gVCF parsing; standard-memory
        # local-SSD nodes are sufficient and avoid paying for high-memory extract drivers.
        - job_cluster_key: prs_fanout_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.prs_fanout_node_type}
            driver_node_type_id: ${var.prs_fanout_node_type}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            num_workers: ${var.prs_fanout_num_workers}
            custom_tags:
              ResourceClass: MultiNode
              work_type: prs_synthetic_fanout
            enable_elastic_disk: true

      tags: ${var.common_resource_tags}

      queue:
        enabled: true

      # ── BATCH onboarding (Stage-0 finding: ~45× cheaper/member than per-member runs) ─────────────
      # The reconcile + scorer are ALREADY batch (one pass scores every missing cell across all pending
      # samples); the lever is the TRIGGER. This file-arrival trigger BATCHES: it fires at most once per
      # `min_time_between_triggers_seconds` and waits for arrivals to settle, so all gVCFs that land in
      # the window are drained in ONE run — the ~fixed per-run floor (reconcile + Spark job launches +
      # MERGE, ~9s) is paid once for the whole batch instead of per member.
      #
      # PAUSED by default: enable (pause_status: UNPAUSED) only after coordinating with any upstream
      # file-delivery producer (e.g. a Cloud Function copying gVCFs into the landing zone) — this trigger
      # should REPLACE per-file job invocation, not run alongside it (otherwise you get both a per-file run
      # AND the batched run). Tune the window to your SLA.
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: ${var.prs_landing_zone}
          min_time_between_triggers_seconds: 3600   # at most hourly → batch an hour of arrivals
          wait_after_last_change_seconds: 300       # let a burst of arrivals settle before firing
