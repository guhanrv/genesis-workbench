resources:
  jobs:
    genomics_prs_pipeline:
      name: genomics_prs_pipeline

      # TOP-LEVEL orchestrator — encodes the cross-module run order that was otherwise tribal
      # knowledge. The pca and prs submodules are independent bundles, so the dependency
      # "pca builds the ancestry basis BEFORE prs classifies against it" lived only in a human's
      # head. This job makes it explicit with run_job_task, in order:
      #
      #   1. pca_reference_setup  (pca_v1 bundle)  → stage panel + build pca_basis.npz   [cross-bundle]
      #   2. prs_scoring          (this bundle)    → register → extract → classify (reads the basis)
      #                                              → reconcile → score(drop) → save
      #   3. prs_reference_setup  (this bundle)    → build pgs_panel_afreq + pgs_panel_ref in ONE panel
      #                                              scan (needs the panel from step 1 AND the pgs_weights
      #                                              registered in step 2) — enables mean_impute + z on
      #                                              FUTURE runs
      #
      # This is the ONE-TIME bootstrap / full first-run for a fresh workspace. Step 1 rebuilds the
      # basis (~expensive, single-node), so in STEADY STATE do NOT run this — run `prs_scoring`
      # directly (it's incremental and reuses the frozen basis artifact). Cross-bundle step 1 needs
      # pca's job id (var.pca_reference_setup_job_id; see variables.yml).

      email_notifications:
        on_failure:
          - ${var.current_user}

      tasks:
        - task_key: build_pca_reference          # cross-bundle → pca_v1's pca_reference_setup
          run_job_task:
            job_id: ${var.pca_reference_setup_job_id}

        - task_key: score_prs                    # same bundle; needs the basis from step 1
          depends_on:
            - task_key: build_pca_reference
          run_job_task:
            job_id: ${resources.jobs.prs_scoring.id}

        - task_key: build_panel_stats            # same bundle; needs panel (step 1) + weights (step 2)
          depends_on:
            - task_key: score_prs
          run_job_task:
            job_id: ${resources.jobs.prs_reference_setup.id}

      tags: ${var.common_resource_tags}
